<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive bookshelf of Andrew Chen's books.">
  <title>Bookshelf | Andrew Chen</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/bookshelf.css">
  <script src="scripts/shelf.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a href="index.html">home</a>
      <a href="about.html">about me</a>
      <a href="blog.html">blog</a>
      <a href="bookshelf.html" aria-current="page">bookshelf</a>
    </nav>
  </header>
  <main class="reading-page bookshelf-page">
    <a class="home-link" href="index.html">Andrew Chen</a>
    <h1>Bookshelf</h1>
    <div class="shelf-viewport">
      <div class="live-shelf" role="group" aria-label="Books">
        <button class="shelf-book is-selected" type="button" aria-pressed="true" aria-label="Siddhartha by Hermann Hesse" data-title="Siddhartha" data-author="Hermann Hesse" data-book="siddhartha" style="--spine-color: #253280; --spine-ink: #fff; --book-height: 254px; --cover-width: 154px; --spine-width: 48px">
          <span class="book-spine" aria-hidden="true"><span>Siddhartha</span><small>Hermann Hesse</small></span>
          <img class="book-cover" src="assets/books/siddhartha.jpg" width="154" height="254" alt="" aria-hidden="true">
        </button>
        <button class="shelf-book" type="button" aria-pressed="false" aria-label="Hadji Murad by Leo Tolstoy" data-title="Hadji Murad" data-author="Leo Tolstoy" data-book="hadji-murad" style="--spine-color: #796644; --spine-ink: #fff; --book-height: 248px; --cover-width: 161px; --spine-width: 48px">
          <span class="book-spine" aria-hidden="true"><span>Hadji Murad</span><small>Leo Tolstoy</small></span>
          <img class="book-cover" src="assets/books/hadji-murad.jpg" width="161" height="248" alt="" aria-hidden="true">
        </button>
        <button class="shelf-book" type="button" aria-pressed="false" aria-label="Zhou Enlai: A Life by Chen Jian" data-title="Zhou Enlai: A Life" data-author="Chen Jian" data-book="zhou-enlai" style="--spine-color: #d2c6ae; --spine-ink: #29241e; --book-height: 272px; --cover-width: 180px; --spine-width: 58px">
          <span class="book-spine" aria-hidden="true"><span>Zhou Enlai: A Life</span><small>Chen Jian</small></span>
          <img class="book-cover" src="assets/books/zhou-enlai.jpg" width="180" height="272" alt="" aria-hidden="true">
        </button>
        <button class="shelf-book" type="button" aria-pressed="false" aria-label="A Sorrow Beyond Dreams by Peter Handke" data-title="A Sorrow Beyond Dreams" data-author="Peter Handke" data-book="a-sorrow-beyond-dreams" style="--spine-color: #283e43; --spine-ink: #fff; --book-height: 244px; --cover-width: 144px; --spine-width: 48px">
          <span class="book-spine" aria-hidden="true"><span>A Sorrow Beyond Dreams</span><small>Peter Handke</small></span>
          <img class="book-cover" src="assets/books/a-sorrow-beyond-dreams.jpg" width="144" height="244" alt="" aria-hidden="true">
        </button>
        <button class="shelf-book" type="button" aria-pressed="false" aria-label="Walden by Henry David Thoreau" data-title="Walden" data-author="Henry David Thoreau" data-book="walden" style="--spine-color: #505846; --spine-ink: #fff; --book-height: 260px; --cover-width: 168px; --spine-width: 48px">
          <span class="book-spine" aria-hidden="true"><span>Walden</span><small>Henry David Thoreau</small></span>
          <img class="book-cover" src="assets/books/walden.jpg" width="168" height="260" alt="" aria-hidden="true">
        </button>
      </div>
    </div>
    <div class="shelf-caption" aria-live="polite" aria-atomic="true">
      <h2 id="selected-title">Siddhartha</h2>
      <p id="selected-author">Hermann Hesse</p>
      <p id="selected-comments" class="book-comments"></p>
    </div>
    <noscript><p>Enable JavaScript to browse the interactive shelf.</p></noscript>
    <!-- Add Andrew's comments below; blank entries intentionally display no text. -->
    <script type="application/json" id="book-comments">
{
      "siddhartha": "",
      "hadji-murad": "",
      "zhou-enlai": "",
      "a-sorrow-beyond-dreams": "",
      "walden": ""
}
    </script>
  </main>
</body>
</html>
